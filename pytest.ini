[pytest]
pythonpath = .
testpaths = tests

# 默认只跑纯单元测试：
#   pytest                    -> 单元测试
#   pytest -m integration     -> 需要本地 MySQL / Redis
#   pytest -m llm             -> 需要真实 LLM / 抓取接口，会产生费用
#   pytest -m ""              -> 全部
addopts = -m "not integration and not llm"

markers =
    integration: 需要本地 MySQL、Redis 与 .env 配置
    llm: 需要真实大模型、Embedding 或抓取接口（会产生费用）
